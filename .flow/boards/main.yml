tasks:
  - name: user-registration
    description: Passwordless sign-up/sign-in via Google or magic link, with a required name/phone profile step before the dashboard.
    track: brief
  - name: club-roles
    description: A signed-in person creates a club (name + location, multi-club, no duplicates) and becomes its Administrator; the club's role set is defined for later assignment.
    track: brief
  - name: member-invitation
    description: An Administrator or Head Coach invites people by email with a role; opening the emailed link signs the invitee in and joins the club with that role.
    track: brief
  - name: register-learner
    description: A public, per-club learn-to-swim sign-up form (fixed fields, 1+ learners, no login) that prospects fill; each sign-up emails and lists for the club's Administrator and Head Coach.
    track: brief
  - name: swim-programs
    description: A shared platform-wide catalog of swim programs, each with 1+ age/skill levels (name, age group, description, fee, capacity); every club can view, and each club sets its own per-level fee and availability. Admin/Head Coach manage; all members view.
    track: brief
